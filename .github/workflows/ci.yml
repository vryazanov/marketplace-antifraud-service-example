name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: antifraud_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d antifraud_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/antifraud_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/antifraud_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen --python 3.13
      - run: uv run ruff check src/ bin/ tests/ migrations/
      - run: uv run ruff format --check src/ bin/ tests/ migrations/
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest tests/ -q
