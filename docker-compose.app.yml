services:
  antifraud-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: antifraud_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d antifraud_db"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [marketplace]

  antifraud-migrate:
    build:
      context: .
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@antifraud-postgres:5432/antifraud_db
    depends_on:
      antifraud-postgres:
        condition: service_healthy
    networks: [marketplace]

  antifraud-service:
    build:
      context: .
    command: ["uv", "run", "python", "-m", "bin.api"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@antifraud-postgres:5432/antifraud_db
      LMS_LLM_API_KEY: ${LMS_LLM_API_KEY:-}
      JEV_BASE_URL: ${JEV_BASE_URL:-https://llm.python-labs.ru/v1/}
      ANTIFRAUD_THRESHOLD: ${ANTIFRAUD_THRESHOLD:-0.85}
    depends_on:
      antifraud-migrate:
        condition: service_completed_successfully
    networks: [marketplace]

networks:
  marketplace:
    external: true
    name: marketplace
volumes:
  pgdata: {}
